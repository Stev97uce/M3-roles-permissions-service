version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: lavanet-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lavanet123
      POSTGRES_DB: lavanet_roles
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lavanet-net

networks:
  lavanet-net:
    driver: bridge

volumes:
  postgres_data:
